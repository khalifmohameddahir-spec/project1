<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bug Network</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background: #080d18;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}
header {
    text-align: center;
    padding: 25px;
}
h1 {
    color: #00ff99;
    margin-bottom: 10px;
}
p {
    color: #aaa;
}
#network {
    position: relative;
    width: 100vw;
    height: 75vh;
}
canvas {
    position: absolute;
    width: 100%;
    height: 100%;
}
.bug {
    position: absolute;
    font-size: 30px;
    cursor: pointer;
    user-select: none;
    z-index: 2;
    transform: translate(-50%, -50%);
    transition: filter 0.2s;
}
.bug:hover {
    filter: drop-shadow(0 0 12px lime);
    transform: translate(-50%, -50%) scale(1.4);
}
.controls {
    text-align: center;
    margin-top: 15px;
}
button {
    background: #00ff99;
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}
button:hover {
    background: white;
}
#count {
    color: #00ff99;
}
</style>
</head>
<body>
<header>
    <h1>🐞 BUG NETWORK</h1>
    <p>Watch bugs connect and build a living network.</p>
    <p>Active Bugs: <span id="count">15</span></p>
</header>
<div id="network">
    <canvas id="canvas"></canvas>
</div>
<div class="controls">
    <button onclick="addBug()">+ Add Bug</button>
    <button onclick="resetBugs()">Reset Network</button>
</div>
<script>
const network = document.getElementById("network");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let bugs = [];
function resizeCanvas() {
    canvas.width = network.clientWidth;
    canvas.height = network.clientHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();
function addBug() {
    const bug = {
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 2,
        vy: (Math.random() - 0.5) * 2,
        element: document.createElement("div")
    };
    bug.element.className = "bug";
    bug.element.textContent = "🐞";
    bug.element.addEventListener("click", () => {
        network.removeChild(bug.element);
        bugs = bugs.filter(item => item !== bug);
        updateCount();
    });
    network.appendChild(bug.element);
    bugs.push(bug);
    updateCount();
}
function updateCount() {
    document.getElementById("count").textContent = bugs.length;
}
function resetBugs() {
    bugs.forEach(bug => {
        bug.element.remove();
    });
    bugs = [];
    for (let i = 0; i < 15; i++) {
        addBug();
    }
}
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bugs.forEach(bug => {
        bug.x += bug.vx;
        bug.y += bug.vy;
        if (bug.x < 15 || bug.x > canvas.width - 15) {
            bug.vx *= -1;
        }
        if (bug.y < 15 || bug.y > canvas.height - 15) {
            bug.vy *= -1;
        }
        bug.element.style.left = bug.x + "px";
        bug.element.style.top = bug.y + "px";
    });
    // Connect nearby bugs
    for (let i = 0; i < bugs.length; i++) {
        for (let j = i + 1; j < bugs.length; j++) {
            let dx = bugs[i].x - bugs[j].x;
            let dy = bugs[i].y - bugs[j].y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 180) {
                ctx.beginPath();
                ctx.moveTo(bugs[i].x, bugs[i].y);
                ctx.lineTo(bugs[j].x, bugs[j].y);
                ctx.strokeStyle =
                    `rgba(0, 255, 153, ${1 - distance / 180})`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animate);
}
// Start with 15 bugs
for (let i = 0; i < 15; i++) {
    addBug();
}
animate();
</script>
</body>
</html>
